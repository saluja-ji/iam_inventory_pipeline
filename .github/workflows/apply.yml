name: apply
on:
  push:
    branches: [main]
    paths: ["pulumi/**", "cmd/**", "internal/**", "otel/**", "go.*"]

permissions:
  id-token: write
  contents: read

concurrency:
  group: pulumi-up
  cancel-in-progress: false

jobs:
  up:
    runs-on: ubuntu-latest
    # Required reviewers on this GitHub Environment provide the manual approval gate.
    # Declaring it also changes the OIDC `sub` claim, which the apply role's trust policy expects.
    environment: production
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: make test
      - run: make package VERSION=${{ github.sha }}
      - uses: pulumi/actions@v6
        with:
          command: up
          stack-name: dev
          work-dir: pulumi/dev
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}?region=${{ vars.AWS_REGION }}
          config-map: |
            aws:region: { value: "${{ vars.AWS_REGION }}" }
            alertEmail: { value: "${{ vars.ALERT_EMAIL }}" }
            githubRepo: { value: "${{ github.repository }}" }
            stateBucketName: { value: "${{ vars.PULUMI_STATE_BUCKET }}" }
            adotLayerArn: { value: "${{ vars.ADOT_LAYER_ARN }}" }
