name: plan
on:
  pull_request:
    paths: ["pulumi/**", "cmd/**", "internal/**", "otel/**", "go.*"]

permissions:
  id-token: write # OIDC, no static AWS keys
  contents: read
  pull-requests: write

concurrency:
  group: pulumi-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    # Fork PRs get no OIDC token and no secrets, which is exactly what we want.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PULUMI_CONFIG_PASSPHRASE: ${{ secrets.PULUMI_CONFIG_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - run: make package
      - uses: pulumi/actions@v6
        with:
          command: preview
          stack-name: dev
          work-dir: pulumi/dev
          cloud-url: s3://${{ vars.PULUMI_STATE_BUCKET }}?region=${{ vars.AWS_REGION }}
          comment-on-pr: true
          config-map: |
            aws:region: { value: "${{ vars.AWS_REGION }}" }
            alertEmail: { value: "${{ vars.ALERT_EMAIL }}" }
            githubRepo: { value: "${{ github.repository }}" }
            stateBucketName: { value: "${{ vars.PULUMI_STATE_BUCKET }}" }
            adotLayerArn: { value: "${{ vars.ADOT_LAYER_ARN }}" }
